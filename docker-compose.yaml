services:
  db:
    image: postgres:16                   # Image pulled from Docker Hub
    environment:                         # Pass environment variables to container
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                      # Map host_port:container_port
    volumes:
      - pgdata:/var/lib/postgresql/data  # Map named_volume:container_path
    healthcheck:                         # Command to verify service readiness, reference: https://medium.com/@cbaah123/docker-compose-health-checks-made-easy-a-practical-guide-3a340571b88e
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:                                # Declare named volume at root